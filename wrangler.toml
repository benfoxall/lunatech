name = "lunatech"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

routes = [
  { pattern = "track.benjaminbenben.com", custom_domain = true }
]

[observability]
enabled = true

# Serve built frontend assets from public directory
[assets]
directory = "public"
binding = "ASSETS"

# Enable preview deployments
[env.preview]
name = "lunatech-preview"
